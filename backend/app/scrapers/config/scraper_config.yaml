    base_url: "https://www.thecut.com"

  # ========================================
  # FASHION & STYLE
  # ========================================

  - name: "Refinery29 Fashion"
    url: "https://www.refinery29.com/en-us/fashion"
    type: "news_site"
    enabled: true
    priority: 3
    max_items: 10
    selectors:
      container: "article"
      title: "h2, h3"
      url: "a"
    fields:
      source: "refinery29"
      data_type: "article"
    base_url: "https://www.refinery29.com"

